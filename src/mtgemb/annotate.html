<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card similarity pilot</title>
<style>
  :root { font: 17px/1.5 system-ui, sans-serif; color: #182631; background: #f5f7f8; }
  body { margin: 0 auto; max-width: 1150px; padding: 1rem; }
  h1 { font-size: 1.5rem; } h2 { font-size: 1.2rem; }
  aside { position: sticky; top: 0; z-index: 1; background: #fff; padding: .6rem 1rem;
    border: 2px solid #607d8b; border-radius: .4rem; }
  #rubric { display: flex; flex-wrap: wrap; gap: .3rem 1.2rem; font-size: .9rem; }
  #rubric p { margin: .2rem 0; }
  #cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  article { background: white; padding: 1rem; border: 1px solid #bac6cc; border-radius: .4rem; }
  .oracle { white-space: pre-wrap; } img { max-width: 100%; max-height: 420px; }
  button, select, textarea { font: inherit; padding: .5rem; }
  button { cursor: pointer; margin: .25rem; } button[aria-pressed="true"] {
    background: #173f59; color: white; }
  :focus-visible { outline: 3px solid #b64b00; outline-offset: 3px; }
  textarea { display: block; width: min(95%, 650px); min-height: 4rem; }
  select { max-width: 100%; } #error { color: #a01017; font-weight: bold; }
  #phase { font-size: 1.3rem; font-weight: bold; }
  fieldset { border: 0; padding: 0; margin: 1rem 0; }
  [hidden] { display: none !important; }
  @media (max-width: 600px) { #cards { grid-template-columns: 1fr; } }
</style>
<h1>Card similarity pilot</h1>
<aside aria-label="Grading rubric"><strong>Judge the candidate as a similar card for the anchor.</strong>
  <div id="rubric"></div>
</aside>
<p id="progress" aria-live="polite"></p>
<p id="phase"></p>
<label><input id="images" type="checkbox"> Show images (loads remote card images)</label>
<p id="position"></p>
<div id="cards"></div>
<form id="judgment" hidden>
  <fieldset id="controls">
    <div id="abilityField" hidden>
      <label for="ability">Which anchor ability does this match? (optional)</label><br>
      <select id="ability"></select>
      <p>Ability keys: a, b, c…; choose “whole card” or none from the selector.</p>
    </div>
    <label for="reason">Reason (optional; saved with your grade)</label>
    <textarea id="reason" maxlength="500"></textarea>
    <p>Choose a grade to save and advance. Keys: 3 / 2 / 1 / 0 / U.</p>
    <div id="grades" role="group" aria-label="Grade"></div>
  </fieldset>
</form>
<p id="status" role="status"></p>
<p id="error" role="alert"></p>
<nav aria-label="Items">
  <button id="back" disabled>Back</button><button id="next" disabled>Next</button>
</nav>
<script>
'use strict';
const $ = id => document.getElementById(id);
let pool, index = 0, busy = false;
const latest = new Map();
const phases = {calibration: 'Calibration — not scored', scored: 'Scored', repeat: 'Repeat check'};
const grades = [3, 2, 1, 0, 'unknown'];
function element(tag, text, parent) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (parent) parent.append(node);
  return node;
}
async function request(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) {
    const detail = await response.json().catch(() => ({}));
    throw new Error(detail.error || `Request failed (${response.status})`);
  }
  return response;
}
function card(id, heading) {
  const data = pool.cards[id], box = element('article', undefined, $('cards'));
  element('h2', `${heading}: ${data.name}`, box);
  for (const face of data.faces) {
    element('h3', face.name, box);
    element('p', face.mana_cost, box);
    element('p', face.type_line, box);
    element('p', face.oracle_text, box).className = 'oracle';
  }
  if ($('images').checked && data.image) {
    const url = new URL(data.image, location.href);
    if (['https:', 'http:'].includes(url.protocol)) {
      const image = element('img', undefined, box);
      image.alt = data.name; image.referrerPolicy = 'no-referrer'; image.src = url.href;
      image.onerror = () => { image.replaceWith(element('p', 'Image unavailable')); };
    }
  }
}
function render() {
  $('error').textContent = ''; $('status').textContent = '';
  $('progress').textContent = Object.entries(phases).map(([phase, name]) => {
    const items = pool.items.filter(item => item.phase === phase);
    return `${name}: ${items.filter(item => latest.has(item.item_id)).length}/${items.length}`;
  }).join(' · ');
  $('back').disabled = busy || index === 0;
  $('next').disabled = busy || index >= pool.items.length - 1;
  $('cards').replaceChildren();
  const item = pool.items[index];
  $('judgment').hidden = !item;
  if (!item) {
    $('phase').textContent = 'All judgments saved';
    $('position').textContent = 'Use Back to review or change a judgment.';
    return;
  }
  $('phase').textContent = phases[item.phase];
  $('position').textContent = `Item ${index + 1} of ${pool.items.length}`;
  card(item.anchor, 'Anchor'); card(item.candidate, 'Candidate');
  const saved = latest.get(item.item_id);
  $('reason').value = saved?.reason ?? '';
  const abilities = pool.cards[item.anchor].abilities;
  $('abilityField').hidden = !abilities.length;
  $('ability').replaceChildren();
  for (const [value, text] of [['', 'None'], ['whole', 'Whole card'],
    ...abilities.map((text, i) => [String(i), `${String.fromCharCode(97 + i)}: ${text}`])]) {
    const option = element('option', text, $('ability')); option.value = value;
  }
  $('ability').value = saved?.ability == null ? '' : String(saved.ability);
  for (const button of $('grades').children) {
    button.setAttribute('aria-pressed', String(saved?.grade === grades[Number(button.dataset.index)]));
  }
  if (saved) $('status').textContent = 'Saved judgment shown. Choose a grade to append a revision.';
}
async function save(grade) {
  if (busy || !pool?.items[index]) return;
  busy = true; $('controls').disabled = true;
  $('back').disabled = true; $('next').disabled = true;
  $('error').textContent = ''; $('status').textContent = 'Saving…';
  const value = $('ability').value;
  const label = {item_id: pool.items[index].item_id, grade,
    ability: value === '' ? null : value === 'whole' ? 'whole' : Number(value),
    reason: $('reason').value};
  try {
    const response = await request('/api/label', {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(label)});
    latest.set(label.item_id, await response.json());
    index++;
    if (index === pool.items.length) {
      const missing = pool.items.findIndex(item => !latest.has(item.item_id));
      if (missing >= 0) index = missing;
    }
    render();
  } catch (error) {
    $('error').textContent = `Save failed: ${error.message}. Your judgment has not advanced.`;
    $('status').textContent = '';
  } finally {
    busy = false; $('controls').disabled = false;
    $('back').disabled = index === 0;
    $('next').disabled = index >= pool.items.length - 1;
  }
}
$('judgment').onsubmit = event => event.preventDefault();
$('back').onclick = () => { if (!busy && index > 0) { index--; render(); } };
$('next').onclick = () => { if (!busy && index < pool.items.length - 1) { index++; render(); } };
$('images').onchange = () => {
  if (!pool || busy || !pool.items[index]) return;
  $('cards').replaceChildren();
  card(pool.items[index].anchor, 'Anchor'); card(pool.items[index].candidate, 'Candidate');
};
document.addEventListener('keydown', event => {
  if (!pool || busy || event.ctrlKey || event.metaKey || event.altKey || event.repeat ||
      ['TEXTAREA', 'INPUT', 'SELECT'].includes(event.target.tagName)) return;
  const key = event.key.toLowerCase();
  if (['3', '2', '1', '0', 'u'].includes(key)) {
    event.preventDefault(); save(key === 'u' ? 'unknown' : Number(key));
  } else if (/^[a-z]$/.test(key) && pool.items[index]) {
    const ability = key.charCodeAt(0) - 97;
    if (ability < pool.cards[pool.items[index].anchor].abilities.length) {
      event.preventDefault(); $('ability').value = String(ability);
    }
  }
});
(async () => {
  try {
    pool = await (await request('/api/pool')).json();
    const lines = await (await request('/api/labels')).text();
    for (const line of lines.split('\n').filter(line => line.trim())) {
      const label = JSON.parse(line); latest.set(label.item_id, label);
    }
    for (const grade of grades) {
      element('p', `${grade === 'unknown' ? 'U' : grade}: ${pool.design.rubric[grade]}`, $('rubric'));
      const button = element('button', grade === 'unknown' ? 'U — Unknown' : String(grade), $('grades'));
      button.type = 'button'; button.dataset.index = grades.indexOf(grade);
      button.onclick = () => save(grade);
    }
    index = pool.items.findIndex(item => !latest.has(item.item_id));
    if (index < 0) index = pool.items.length;
    render();
  } catch (error) { $('error').textContent = `Could not load pilot: ${error.message}`; }
})();
</script>
</html>
